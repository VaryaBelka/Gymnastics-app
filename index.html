<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Дневник Тренера</title>
  <style>
    :root{
      --bg:#0b1020;
      --card:#121a33;
       --text:#e9efff;
      --muted:#a9b4d0;
      --line:rgba(255,255,255,.10);
      --accent:#6aa7ff;
      --danger:#ff6a7a;
      --ok:#52e3a5;
      --shadow: 0 10px 30px rgba(0,0,0,.25);
      --radius:14px;
      --radius2:10px;
      --btn: rgba(255,255,255,.08);
      --btn2: rgba(255,255,255,.12);
      --focus: 0 0 0 3px rgba(106,167,255,.35);
      --font: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    [data-theme="light"]{
      --bg:#f5f7ff;
      --card:#ffffff;
      --text:#111827;
      --muted:#4b5563;
      --line:rgba(0,0,0,.08);
      --accent:#2563eb;
      --danger:#dc2626;
      --ok:#16a34a;
      --shadow: 0 10px 30px rgba(0,0,0,.08);
      --btn: rgba(0,0,0,.04);
      --btn2: rgba(0,0,0,.06);
      --focus: 0 0 0 3px rgba(37,99,235,.22);
    }
    *{ box-sizing: border-box; }
    body{
      margin:0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
    }

      position: sticky;
      top:0;
      z-index: 30;

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
