<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дневник Тренера PRO</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #fce4ec; margin: 0; padding: 10px; color: #333; }
        .screen { display: none; }
        .active { display: block; }
        h2, h3 { text-align: center; color: #d81b60; margin-top: 0; }
        button { display: block; width: 100%; padding: 12px; margin-bottom: 10px; background: white; border: 2px solid #f8bbd0; border-radius: 8px; font-size: 16px; font-weight: bold; color: #880e4f; cursor: pointer; text-align: left;}
        .back { background: none; border: none; color: #d81b60; padding: 0 0 10px 0; font-weight: bold;}
        .card { background: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; cursor: pointer; }
        .name { font-weight: bold; font-size: 16px; }
        .grade { font-size: 18px; background: #fff3e0; padding: 5px 10px; border-radius: 8px; border: 1px solid #ffcc80; }
        .form-box { display: none; background: white; padding: 15px; border-radius: 8px; margin-top: 10px; }
        input, textarea, select { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px;}
        .btn-save { background: #4caf50; color: white; border: none; text-align: center;}
        .btn-del { background: #f44336; color: white; border: none; text-align: center;}
        .btn-blue { background: #2196f3; color: white; border: none; text-align: center;}
        .log-item { background: #f5f5f5; padding: 8px; margin-bottom: 5px; display: flex; justify-content: space-between; border-radius: 4px;}
        .legend { background: white; padding: 10px; margin-top: 15px; font-size: 12px; border-left: 4px solid #f8bbd0; border-radius: 4px;}
        .row { display: flex; gap: 10px; align-items: center; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #eee; border: 2px solid #f8bbd0;}
    </style>
</head>
<body>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="screen active">
        <h2>📖 Дневник Тренера PRO</h2>
        <div id="groups-list"></div>
        <button class="btn-blue" onclick="showScreen('group-edit')">+ Создать новую группу</button>
        <button class="btn-save" onclick="openMaterials()">📚 Темы и материалы</button>
    </div>

    <!-- ЭКРАН ГРУППЫ -->
    <div id="group-screen" class="screen">
        <button class="back" onclick="showScreen('main-menu')">← Назад к группам</button>
        <h3 id="group-title"></h3>
        <p id="group-desc" style="text-align:center; font-size:14px; color:#777;"></p>
        <div style="text-align:center; margin-bottom:10px;">
            <button class="btn-blue" style="display:inline-block; width:auto; padding:5px 10px; font-size:12px;" onclick="editGroup()">⚙️ Настройки группы</button>
        </div>
        <div id="students-list"></div>
        <button class="btn-save" onclick="openStudentEdit(null)">+ Добавить ученика</button>
    </div>

    <!-- РЕДАКТОР ГРУППЫ -->
    <div id="group-edit" class="screen">
        <button class="back" onclick="showScreen('main-menu')">← Отмена</button>
        <h3>Группа</h3>
        <div class="form-box" style="display:block;">
            <input type="text" id="g-name" placeholder="Название (например: Младшая)">
            <input type="text" id="g-desc" placeholder="Описание группы">
            <select id="g-type">
                <option value="smile">Оценки: Смайлики (младшие)</option>
                <option value="digit">Оценки: Цифры 1-10 (старшие)</option>
            </select>
            <button class="btn-save" onclick="saveGroup()">Сохранить</button>
            <button class="btn-del" id="g-del-btn" onclick="deleteGroup()" style="display:none;">Удалить группу</button>
        </div>
    </div>

    <!-- ПРОФИЛЬ УЧЕНИКА -->
    <div id="student-screen" class="screen">
        <button class="back" onclick="closeStudent()">← Назад к группе</button>
        <h3 id="s-title"></h3>
        <div class="form-box" style="display:block;">
            <div class="row">
                <img id="s-photo-view" class="avatar" src="https://cdn-icons-png.flaticon.com/512/847/847969.png">
                <input type="file" id="s-photo" accept="image/*" style="width:auto;">
            </div>
            <input type="text" id="s-name" placeholder="Имя">
            <input type="date" id="s-birthday" placeholder="Дата рождения">
            <input type="date" id="s-date" placeholder="Дата зачисления">
            <textarea id="s-notes" rows="2" placeholder="Характеристика"></textarea>
            <select id="s-group-id"></select>
            <button class="btn-save" onclick="saveStudent()">Сохранить</button>
            <button class="btn-del" id="s-del-btn" onclick="deleteStudent()" style="display:none;">Удалить</button>
        </div>
        
        <div style="background:white; padding:10px; border-radius:8px; margin-top:15px;">
            <h4>Журнал по датам</h4>
            <div id="s-logs"></div>
            <div style="display:flex; gap:5px; margin-top:10px;">
                <input type="date" id="log-date" style="flex:1;">
                <input type="text" id="log-grade" placeholder="Оценка" style="flex:1;">
                <button class="btn-blue" style="width:auto; padding:0 10px;" onclick="addLog()">+</button>
            </div>
        </div>

        <div style="background:white; padding:10px; border-radius:8px; margin-top:15px;">
            <h4>Итоговые оценки (Средний балл)</h4>
            <p><b>Четверть:</b> <span id="s-q"></span></p>
            <p><b>Год:</b> <span id="s-y"></span></p>
        </div>
    </div>

    <!-- ТЕМЫ И МАТЕРИАЛЫ -->
    <div id="materials-screen" class="screen">
        <button class="back" onclick="showScreen('main-menu')">← Назад в меню</button>
        <h3>📚 Темы и материалы</h3>
        <div id="materials-list"></div>
        <div class="form-box" style="display:block;">
            <input type="text" id="m-title" placeholder="Название темы (например: Кувырок вперед)">
            <input type="number" id="m-level" placeholder="Уровень сложности (1-10)" min="1" max="10">
            <button class="btn-save" onclick="saveMaterial()">Добавить материал</button>
        </div>
    </div>

    <script>
        // БАЗА ДАННЫХ
        var db = JSON.parse(localStorage.getItem('gymProDB')) || {
            groups: [
                { id: 'g1', name: "Младшая группа", desc: "3-8 лет", type: "smile", students: [] },
                { id: 'g2', name: "Средняя группа", desc: "9-14 лет", type: "digit", students: [] }
            ],
            materials: [
                { id: 'm1', title: "Кувырок вперед", level: 1 },
                { id: 'm2', title: "Шпагат", level: 3 }
            ]
        };

        var currentGroupId = null;
        var currentStudentId = null;

        // НАВИГАЦИЯ
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'main-menu') renderGroups();
        }

        // ГРУППЫ
        function renderGroups() {
            var list = document.getElementById('groups-list');
            list.innerHTML = '';
            db.groups.forEach(g => {
                var b = document.createElement('button');
                b.innerHTML = `📁 ${g.name}`;
                b.onclick = function() { openGroup(g.id); };
                list.appendChild(b);
            });
        }

        function openGroup(id) {
            currentGroupId = id;
            var g = db.groups.find(x => x.id === id);
            document.getElementById('group-title').innerText = g.name;
            document.getElementById('group-desc').innerText = g.desc;
            showScreen('group-screen');
            renderStudents();
        }

        function editGroup() {
            var g = db.groups.find(x => x.id === currentGroupId);
            document.getElementById('g-name').value = g.name;
            document.getElementById('g-desc').value = g.desc;
            document.getElementById('g-type').value = g.type;
            document.getElementById('g-del-btn').style.display = 'block';
            showScreen('group-edit');
        }

        function saveGroup() {
            var name = document.getElementById('g-name').value;
            var desc = document.getElementById('g-desc').value;
            var type = document.getElementById('g-type').value;
            if(!name) return alert("Введите название!");
            
            if(currentGroupId) {
                var g = db.groups.find(x => x.id === currentGroupId);
                g.name = name; g.desc = desc; g.type = type;
            } else {
                db.groups.push({ id: 'g' + Date.now(), name: name, desc: desc, type: type, students: [] });
            }
            saveDB(); showScreen('main-menu');
        }

        function deleteGroup() {
            if(confirm("Удалить группу и всех её учеников?")) {
                db.groups = db.groups.filter(x => x.id !== currentGroupId);
                saveDB(); showScreen('main-menu');
            }
        }

        // УЧЕНИКИ
        function renderStudents() {
            var g = db.groups.find(x => x.id === currentGroupId);
            var list = document.getElementById('students-list');
            list.innerHTML = '';
            if(g.students.length === 0) list.innerHTML = '<p style="text-align:center;">Нет учеников</p>';
            
            g.students.forEach(s => {
                var d = document.createElement('div');
                d.className = 'card';
                d.innerHTML = `<div class="row">
                    <img src="${s.photo || 'https://cdn-icons-png.flaticon.com/512/847/847969.png'}" class="avatar">
                    <div><div class="name">${s.name}</div><div style="font-size:12px; color:#777;">${s.age || ''}</div></div>
                </div>`;
                d.onclick = function() { openStudent(s.id); };
                list.appendChild(d);
            });
        }

        function openStudentEdit(id) {
            currentStudentId = id;
            document.getElementById('s-del-btn').style.display = id ? 'block' : 'none';
            
            // Заполняем список групп для перевода
            var sel = document.getElementById('s-group-id');
            sel.innerHTML = '';
            db.groups.forEach(g => {
                sel.innerHTML += `<option value="${g.id}" ${g.id === currentGroupId ? 'selected' : ''}>${g.name}</option>`;
            });

            if(id) {
                var s = db.groups.find(x => x.id === currentGroupId).students.find(x => x.id === id);
                document.getElementById('s-name').value = s.name;
                document.getElementById('s-birthday').value = s.birthday || '';
                document.getElementById('s-date').value = s.date || '';
                document.getElementById('s-notes').value = s.notes || '';
                document.getElementById('s-photo-view').src = s.photo || 'https://cdn-icons-png.flaticon.com/512/847/847969.png';
            } else {
                document.getElementById('s-name').value = '';
                document.getElementById('s-birthday').value = '';
                document.getElementById('s-date').value = '';
                document.getElementById('s-notes').value = '';
                document.getElementById('s-photo-view').src = 'https://cdn-icons-png.flaticon.com/512/847/847969.png';
            }
            showScreen('student-screen');
        }

        function saveStudent() {
            var name = document.getElementById('s-name').value;
            if(!name) return alert("Введите имя!");
            
            var targetGroupId = document.getElementById('s-group-id').value;
            var studentData = {
                id: currentStudentId || 's' + Date.now(),
                name: name,
                birthday: document.getElementById('s-birthday').value,
                date: document.getElementById('s-date').value,
                notes: document.getElementById('s-notes').value,
                photo: document.getElementById('s-photo-view').src,
                logs: {}
            };

            // Если редактируем существующего
            if(currentStudentId) {
                var s = db.groups.find(x => x.id === currentGroupId).students.find(x => x.id === currentStudentId);
                studentData.logs = s.logs || {}; // Сохраняем старые оценки
                
                // Удаляем из старой группы
                db.groups.find(x => x.id === currentGroupId).students = db.groups.find(x => x.id === currentGroupId).students.filter(x => x.id !== currentStudentId);
            }

            // Добавляем в новую (или ту же) группу
            db.groups.find(x => x.id === targetGroupId).students.push(studentData);
            
            saveDB(); closeStudent();
        }

        function deleteStudent() {
            if(confirm("Удалить ученика?")) {
                db.groups.find(x => x.id === currentGroupId).students = db.groups.find(x => x.id === currentGroupId).students.filter(x => x.id !== currentStudentId);
                saveDB(); closeStudent();
            }
        }

        function closeStudent() { showScreen('group-screen'); renderStudents(); }

        // ЖУРНАЛ И ОЦЕНКИ
        function openStudent(id) {
            currentStudentId = id;
            var s = db.groups.find(x => x.id === currentGroupId).students.find(x => x.id === id);
            document.getElementById('s-title').innerText = s.name;
            
            // Отрисовка журнала
            var logs = document.getElementById('s-logs');
            logs.innerHTML = '';
            var sum = 0, count = 0;
            
            if(s.logs) {
                Object.keys(s.logs).sort().reverse().forEach(date => {
                    var grade = s.logs[date];
                    logs.innerHTML += `<div class="log-item"><span>${date}</span> <b>${grade}</b></div>`;
                    // Считаем средний балл только для цифр
                    if(!isNaN(parseInt(grade)) && grade !== 'Н') {
                        sum += parseInt(grade); count++;
                    }
                });
            }
            var avg = count > 0 ? (sum / count).toFixed(1) : 'Нет оценок';
            document.getElementById('s-q').innerText = avg;
            document.getElementById('s-y').innerText = avg; // Упрощенно: годовая = средняя

            showScreen('student-screen');
        }

        function addLog() {
            var date = document.getElementById('log-date').value;
            var grade = document.getElementById('log-grade').value;
            if(!date || !grade) return alert("Выберите дату и оценку!");

            var s = db.groups.find(x => x.id === currentGroupId).students.find(x => x.id === currentStudentId);
            if(!s.logs) s.logs = {};
            s.logs[date] = grade;
            
            saveDB(); openStudent(currentStudentId); // Перерисовываем
        }

        // МАТЕРИАЛЫ
        function openMaterials() {
            showScreen('materials-screen');
            var list = document.getElementById('materials-list');
            list.innerHTML = '';
            db.materials.forEach(m => {
                list.innerHTML += `<div class="log-item"><span>${m.title}</span> <b>Уровень: ${m.level}</b></div>`;
            });
        }

        function saveMaterial() {
            var title = document.getElementById('m-title').value;
            var level = document.getElementById('m-level').value;
            if(!title || !level) return alert("Заполните поля!");
            db.materials.push({ id: 'm' + Date.now(), title: title, level: level });
            saveDB(); openMaterials();
            document.getElementById('m-title').value = '';
        }

        // СОХРАНЕНИЕ
        function saveDB() { localStorage.setItem('gymProDB', JSON.stringify(db)); }
        
        // Запуск
        renderGroups();
    </script>
</body>
</html>
